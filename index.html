<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Click-Through Carousel</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 0;
  }

  .wrapper {
    width: 100%;
    max-width: 900px;
  }

  .carousel {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 8px;
    background: #111;
  }

  .slides {
    display: flex;
    height: 100%;
    transition: transform 0.4s ease;
  }

  .slide {
    min-width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 2rem;
    font-weight: 600;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: none;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 1.4rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-btn:hover { background: rgba(0,0,0,0.8); }
  .prev { left: 12px; }
  .next { right: 12px; }

  .dots {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    cursor: pointer;
  }
  .dot.active { background: #fff; }

  /* Thumbnail strip */
  .thumbs {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .thumb {
    flex: 0 0 auto;
    width: 90px;
    aspect-ratio: 16 / 9;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    opacity: 0.6;
    transition: opacity 0.2s ease, border-color 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .thumb:hover {
    opacity: 0.85;
  }

  .thumb.active {
    opacity: 1;
    border-color: #fff;
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="carousel">
    <div class="slides" id="slides">
      <div class="slide"><img src="images/AutoOEMWelcomeSeries.png" alt="Automotive OEM Welcome Series"></div>
      <div class="slide"><img src="images/PackagingWelcomeSeries.png" alt="Packaging Welcome Series"></div>
      <div class="slide"><img src="images/ICWelcomeSeries.png" alt="Industrial Coatings Welcome Series"></div>
    </div>

    <button class="nav-btn prev" onclick="move(-1)">&#10094;</button>
    <button class="nav-btn next" onclick="move(1)">&#10095;</button>

    <div class="dots" id="dots"></div>
  </div>

  <!-- Thumbnail lineup -->
  <div class="thumbs" id="thumbs"></div>
</div>

<script>
  const slidesEl = document.getElementById('slides');
  const slides = document.querySelectorAll('.slide');
  const dotsEl = document.getElementById('dots');
  const thumbsEl = document.getElementById('thumbs');
  let index = 0;

  slides.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.onclick = () => goTo(i);
    dotsEl.appendChild(dot);
  });
  const dots = document.querySelectorAll('.dot');

  // Build the thumbnail lineup by cloning each slide's visual content
  slides.forEach((slide, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'thumb' + (i === 0 ? ' active' : '');
    thumb.onclick = () => goTo(i);

    const img = slide.querySelector('img');
    if (img) {
      const thumbImg = document.createElement('img');
      thumbImg.src = img.src;
      thumbImg.alt = img.alt || '';
      thumb.appendChild(thumbImg);
    } else {
      // fallback: color swatch + label, matches the slide's background/text
      thumb.style.background = slide.style.background;
      thumb.textContent = slide.textContent;
    }

    thumbsEl.appendChild(thumb);
  });
  const thumbs = document.querySelectorAll('.thumb');

  function update() {
    slidesEl.style.transform = `translateX(-${index * 100}%)`;
    dots.forEach((d, i) => d.classList.toggle('active', i === index));
    thumbs.forEach((t, i) => t.classList.toggle('active', i === index));
  }

  function move(dir) {
    index = (index + dir + slides.length) % slides.length;
    update();
  }

  function goTo(i) {
    index = i;
    update();
  }
</script>

</body>
</html>
